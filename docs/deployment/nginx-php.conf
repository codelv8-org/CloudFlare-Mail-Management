# Example server body. Configure domain, TLS and the PHP-FPM socket in aaPanel.
# /www/wwwroot/relaydesk/public is the ONLY document root.
root /www/wwwroot/relaydesk/public;
index index.php;
client_max_body_size 300k;
location ~ /\. { deny all; }
location ~* ^/(?:src|templates|database|scripts|tests|docs|data|backups|logs|node_modules)(?:/|$) { return 404; }
location = /router.php { return 404; }
location / { try_files $uri /index.php$is_args$args; }
location = /index.php {
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $document_root/index.php;
    # Replace this with the exact socket of your aaPanel PHP 8.3 installation.
    fastcgi_pass unix:/tmp/php-cgi-83.sock;
    fastcgi_read_timeout 150s;
    fastcgi_buffering off;
}
location ~ \.php$ { return 404; }
location ~* \.(?:css|js|svg|woff2|png|jpg|webp)$ { try_files $uri =404; }
