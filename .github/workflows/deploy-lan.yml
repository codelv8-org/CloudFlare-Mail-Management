name: Deploy to LAN aaPanel

# CI always runs on GitHub-hosted runners; only a verified push to main
# can dispatch this privileged LAN deployment job.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: relaydesk-production-lan
  cancel-in-progress: false

jobs:
  deploy:
    # Self-hosted runners are not safe for public repositories.
    # This job is intentionally disabled until the repository is private.
    if: >-
      ${{ github.event.repository.private == true &&
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_branch == 'main' &&
          github.event.workflow_run.head_repository.full_name == github.repository }}
    environment:
      name: production
    runs-on:
      group: relaydesk-production
      labels: [self-hosted, linux, x64, relaydesk-deploy]
    timeout-minutes: 45
    steps:
      - name: Checkout the exact commit verified by CI
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Deploy through LAN SSH (no inbound public SSH required)
        shell: bash
        env:
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_SSH_PORT: ${{ vars.DEPLOY_SSH_PORT }}
          DEPLOY_ROOT: ${{ vars.DEPLOY_ROOT }}
          DEPLOY_SSH_KEY_FILE: ${{ vars.DEPLOY_SSH_KEY_FILE }}
          DEPLOY_SSH_KNOWN_HOSTS: ${{ vars.DEPLOY_SSH_KNOWN_HOSTS }}
          DEPLOY_HEALTH_URL: ${{ vars.DEPLOY_HEALTH_URL }}
          DEPLOY_NODE_BIN_DIR: ${{ vars.DEPLOY_NODE_BIN_DIR }}
        run: bash scripts/deploy-lan.sh
