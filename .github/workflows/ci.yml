name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: PHP, MySQL and browser verification
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: 'true'
      TEST_DB_PORT: '3306'
      TEST_DB_USER: root
      TEST_DB_PASSWORD: ci-test-only-password
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-test-only-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pci-test-only-password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
      - name: Install PHP 8.3 extensions
        run: |
          sudo apt-get update
          sudo apt-get install -y php8.3-cli php8.3-mysql php8.3-curl php8.3-mbstring
          php -v
          php -m

      - name: Check browser JavaScript syntax
        run: |
          node --check public/assets/app.js
          node --check public/assets/login.js
          node --check tests/php-ui.mjs

      # Keep browser tooling outside the application dependency tree.
      - name: Install Playwright and Chromium
        env:
          PLAYWRIGHT_TOOL_DIR: ${{ runner.temp }}/relaydesk-playwright
        run: |
          npm install --prefix "$PLAYWRIGHT_TOOL_DIR" --no-save --package-lock=false --ignore-scripts playwright@1.62.1
          node "$PLAYWRIGHT_TOOL_DIR/node_modules/playwright/cli.js" install --with-deps chromium

      - name: Test PHP, MySQL persistence, concurrency and UI
        env:
          PLAYWRIGHT_PACKAGE_PATH: ${{ runner.temp }}/relaydesk-playwright/node_modules/playwright/index.mjs
        run: php scripts/verify.php --ui

      - name: Preserve test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: php-mysql-browser-evidence
          path: outputs/php-tests-*
          if-no-files-found: ignore
